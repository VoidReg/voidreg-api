title = "How to validate a semantic color system"
category = "DESIGN ENGINEERING"
summary = "A practical approach to testing contrast, interaction states, and theme consistency."
featured = true
sort_order = 0

[[articles.sections]]
heading = "Start with semantic roles"
kind = "prose"
body = "A semantic palette describes the job of a color: foreground, surface, border, or action. It lets a component express intent without hard-coding one theme's appearance."

[[articles.sections]]
heading = "Test relationships, not swatches"
kind = "prose"
body = "Check foreground and background pairs in each actual component state. A passing body-text pair does not establish that a hover state, focus ring, or muted label is readable."

[[articles.sections]]
heading = "Keep the checks reproducible"
kind = "prose"
body = "Record the role pair, theme, state, and contrast result together. Test the same set after changing a token so regressions can be traced to a specific relationship."

[[articles.sections]]
heading = "CSS · illustrative excerpt"
kind = "code"
body = """--background: #FFFFFF;
--foreground: #17212B;
--primary: #9A3412;"""

[[articles.sections]]
heading = "Review the interface"
kind = "prose"
body = "Numeric checks complement visual review. Inspect rendered screens, long labels, and light/dark variants before treating a palette as ready for use."

[[articles.sections]]
heading = "Draft review"
kind = "callout"
body = "Technical accuracy, ownership, sources, dates, and external destinations must be reviewed before publication."

