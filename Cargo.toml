[package]
name = "voidreg-api"
version = "0.1.0"
edition = "2024"
default-run = "voidreg-api"

[features]
default = ["swagger"]
swagger = ["dep:utoipa", "dep:utoipa-swagger-ui"]

[dependencies]
actix-cors = "0.7"
actix-web = { version = "4.15.0", features = ["macros"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
toasty = { version = "0.10", features = ["turso"] }
toasty-driver-turso = { version = "0.10", features = ["sync"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "signal",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "native-tls",
] }
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "std",
] }
utoipa = { version = "5.5.0", features = ["actix_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["actix-web"], optional = true }
uuid = { version = "1", features = ["v4"] }

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
strip = false
lto = false
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3

# cargo test defaults to this; keep it identical to dev so CI does not
# compile a second "test" codegen of the same crates.
[profile.test]
inherits = "dev"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
